# flet_open_file — Flet 0.85 extension wrapping the Flutter `open_filex` plugin.
#
# PURPOSE: install the downloaded APK update IN PLACE. The updater previously
# handed the .apk to ft.Share, which opens the OS SHARE SHEET — an app chooser
# where the user has to hunt for "Package installer" (reported as "selecting
# the download place"). Opening the file directly makes Android route it
# straight to the package installer instead.
#
# Structure/build config mirror flet_local_auth (itself modeled on
# flet-secure-storage 0.85.3): a hatchling wheel that force-includes the
# top-level flutter/ dir so `flet build` compiles the bundled plugin.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flet-open-file"
version = "0.1.0"
description = "Flet open-local-file control (routes an .apk to the Android installer)"
requires-python = ">=3.9"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["flet_open_file"]

[tool.hatch.build.targets.wheel.force-include]
"flutter" = "flutter"
