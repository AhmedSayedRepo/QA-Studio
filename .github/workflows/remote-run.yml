# Remote-run executor — runs ONE queued remote_runs row (Supabase) with the
# same engine the desktop app uses. Dispatched by the app (or manually) via
# the GitHub API / gh CLI:
#
#   gh workflow run remote-run.yml -f run_id=<uuid>
#
# See REMOTE_RUNS.md for the required repository secrets and setup steps.
name: Remote Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "remote_runs.id (uuid) to execute"
        required: true
        type: string

# One job per run id; never cancel an in-flight run by re-dispatching it.
concurrency:
  group: remote-run-${{ github.event.inputs.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    # Hard ceiling well above any sane run; a stuck provider can't burn the
    # whole month's minutes. (Billed minutes = actual wall clock, not this.)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # engine.py's Azure DevOps calls lazily import azure.devops.* (pinned
        # to the desktop build's requirements.txt). selenium + openpyxl:
        # Automation runs (live inspection in the runner's preinstalled
        # Google Chrome; CSV/XLSX uploads).
        run: pip install --quiet requests azure-core==1.41.0 azure-devops==7.1.0b4 msrest==0.7.1 selenium==4.45.0 openpyxl==3.1.5

      - name: Git identity for Automation pushes
        run: |
          git config --global user.name "QA Studio Remote Run"
          git config --global user.email "qa-studio-remote@users.noreply.github.com"

      - name: Execute run
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_ORG: ${{ secrets.AZURE_ORG }}
          AZURE_PAT: ${{ secrets.AZURE_PAT }}
          QA_AI_PROVIDER: ${{ secrets.QA_AI_PROVIDER }}
          QA_AI_API_KEY: ${{ secrets.QA_AI_API_KEY }}
          QA_AI_MODEL: ${{ secrets.QA_AI_MODEL }}
        run: python run_worker.py