# Build the QA Studio Android APK on GitHub Actions (MOBILE_PLAN.md Phase 1) —
# no local Flutter/Android SDK needed. Trigger manually:
#
#   gh workflow run build-apk.yml
#
# The APK lands as a downloadable artifact on the run page (sideload it onto
# an Android phone: download → open → allow "install unknown apps").
#
# EXPERIMENTAL: first `flet build` runs commonly need an iteration or two on
# toolchain quirks. The app is staged into a CLEAN directory with a MINIMAL
# requirements.txt on purpose — the desktop requirements bundle export
# libraries (docx/xlsx/pdf) that are imported lazily on desktop only; pulling
# them into the mobile bundle would bloat it and risk non-pure wheels failing
# the cross-compile. Engine/auth need `requests` only.
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          # flet 0.85.3's CLI requires EXACTLY this Flutter SDK; anything else
          # triggers an interactive "install 3.41.7 now? [y/n]" prompt that
          # EOFErrors on CI (confirmed on the first dispatch).
          flutter-version: "3.41.7"
          channel: stable

      - name: Install flet CLI
        run: pip install --quiet "flet[all]==0.85.3"

      - name: Stage mobile app (clean dir, minimal requirements)
        run: |
          mkdir -p /tmp/mobile
          cp *.py /tmp/mobile/
          cp app.ico /tmp/mobile/ 2>/dev/null || true
          # VERSION must ship in the bundle: the mobile update NOTICE compares
          # engine.local_version() (reads this file) against the repo's copy —
          # without it local_version() returns 0.0.0 and every launch nags.
          cp VERSION /tmp/mobile/ 2>/dev/null || true
          printf "flet==0.85.3\nrequests\n" > /tmp/mobile/requirements.txt

      # INCIDENT this step guards against: with no signing config, each CI run
      # got a fresh, random debug-style key from the ephemeral runner (a new
      # keystore every dispatch — nothing persists between runs). Android
      # refuses to install an APK over an existing install signed with a
      # DIFFERENT certificate ("App not installed as package conflicts with an
      # existing package") — so every single build after the first broke
      # in-place updates on-device, forcing an uninstall every time. Fixed by
      # signing every build with the SAME persistent keystore (repo secret),
      # so successive releases share one certificate and install over each
      # other normally, like any real Android app.
      - name: Decode Android signing keystore
        working-directory: /tmp/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 repo secret is not set. Building without it"
            echo "::error::reproduces the 'conflicts with an existing package' bug on every"
            echo "::error::future update (each build gets a different throwaway key). Add the"
            echo "::error::four ANDROID_* secrets (see qa-studio-signing/SETUP.md) before"
            echo "::error::re-running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > qa-studio-release.jks

      - name: Build APK
        working-directory: /tmp/mobile
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: /tmp/mobile/qa-studio-release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # `yes |` auto-answers any residual interactive confirm (e.g. flet
          # offering to install its own Flutter) — CI has no stdin.
          yes | flet build apk --project "QA Studio" --org com.qastudio --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-studio-apk
          path: /tmp/mobile/build/apk/*.apk
          if-no-files-found: error
