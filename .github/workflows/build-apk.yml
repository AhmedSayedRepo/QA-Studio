# Build the QA Studio Android APK on GitHub Actions (MOBILE_PLAN.md Phase 1) —
# no local Flutter/Android SDK needed. Trigger manually:
#
#   gh workflow run build-apk.yml
#
# The APK lands as a downloadable artifact on the run page (sideload it onto
# an Android phone: download → open → allow "install unknown apps").
#
# EXPERIMENTAL: first `flet build` runs commonly need an iteration or two on
# toolchain quirks. The app is staged into a CLEAN directory with a curated
# requirements.txt (see the "Stage mobile app" step): engine/auth need
# `requests`, and the export buttons need openpyxl/python-docx/reportlab —
# these are bundled so Word/Excel/PDF exports work on-device (the docx/pdf
# libraries carry native components; see the requirements printf's note if a
# build ever fails resolving a wheel for android-arm64).
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write   # needed by the "Publish to rolling release" step below
                     # (gh release create/upload against this same repo)

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          # flet 0.85.3's CLI requires EXACTLY this Flutter SDK; anything else
          # triggers an interactive "install 3.41.7 now? [y/n]" prompt that
          # EOFErrors on CI (confirmed on the first dispatch).
          flutter-version: "3.41.7"
          channel: stable

      - name: Install flet CLI
        run: pip install --quiet "flet[all]==0.85.3"

      - name: Build & install flet_local_auth extension
        run: |
          # Decoupled biometric-gate extension (Python + a bundled Flutter
          # local_auth plugin) — see mobile_ext/flet_local_auth/. Build a wheel
          # (its pyproject force-includes the flutter/ dir at the wheel root, the
          # same layout flet-secure-storage ships) and install it into THIS CI
          # env so `flet build` detects and compiles its Flutter side. The wheel
          # is also copied into the app bundle + added to requirements below so
          # the Python module ships on-device. If a future build ever fails
          # resolving the Flutter plugin, this whole extension is optional: the
          # app falls back to the sentinel-storage gate at runtime, so dropping
          # this step + the two staging lines below reverts cleanly.
          pip install --quiet build hatchling
          python -m build --wheel mobile_ext/flet_local_auth -o /tmp/ext-wheels
          pip install --quiet /tmp/ext-wheels/flet_local_auth-*.whl
          ls -la /tmp/ext-wheels

      - name: Stage mobile app (clean dir, minimal requirements)
        run: |
          mkdir -p /tmp/mobile
          cp *.py /tmp/mobile/
          cp app.ico /tmp/mobile/ 2>/dev/null || true
          # In-app logo (login screen, nav rail, dialogs — ui.py's logo_img()):
          # _logo_path()/_logo_b64() look for app.png/qa-logo.png next to
          # ui.py itself at RUNTIME (os.path.dirname(os.path.abspath(__file__))),
          # not via any bundled-asset mechanism — a plain filesystem read that
          # works on desktop because those PNGs sit next to ui.py in the repo,
          # but this staged directory only ever copied *.py, so neither file
          # ever existed here. logo_img() silently falls through to its
          # fallback_icon (a generic flask/science glyph) when both lookups
          # come up empty — which is why the login screen (and everywhere else
          # logo_img() is used) showed that icon instead of the real logo on
          # every mobile build to date. Stage both candidate names so it
          # finds one regardless of which ui.py currently prefers.
          cp app.png /tmp/mobile/ 2>/dev/null || true
          cp qa-logo.png /tmp/mobile/ 2>/dev/null || true
          # Provider logos (Anthropic/OpenAI/NVIDIA/Gemini/… brand icons):
          # main.py's _provider_logo() reads providers/<id>.png next to the
          # app at RUNTIME (os.path.dirname(__file__)/providers/…), same plain
          # filesystem read as the app logo above. Staging only ever copied
          # *.py, so this folder never existed on device and every provider
          # fell through to the coloured first-letter glyph placeholder
          # (reported live: "I need the logos for connected providers like the
          # desktop app"). Stage the whole folder so the real logos show.
          cp -r providers /tmp/mobile/ 2>/dev/null || true
          # VERSION must ship in the bundle: the mobile update NOTICE compares
          # engine.local_version() (reads this file) against the repo's copy —
          # without it local_version() returns 0.0.0 and every launch nags.
          cp VERSION /tmp/mobile/ 2>/dev/null || true
          # flet-secure-storage: Flet's own first-party wrapper around
          # Flutter's flutter_secure_storage plugin (Android Keystore / iOS
          # Keychain backed). Unlike `cryptography` (deliberately excluded
          # above - a Rust/OpenSSL-backed wheel, real cross-compile risk),
          # this ships as a pure-Python (py3-none-any) wheel; the native code
          # lives in the bundled Flutter/Dart plugin, which `flet build apk`
          # compiles the normal Flutter-plugin way, not via pip.
          #
          # azure-core/azure-devops/msrest: MOBILE_PLAN.md's header claimed
          # "engine.py is pure-HTTP since the SDK removal" — false. engine.py
          # still does `from azure.devops...` lazily inside create_test_case()
          # and update_test_case_with_steps() (run_titles'/run_steps' actual
          # Azure DevOps write calls), so without these packages every
          # on-device Run crashes past Setup with "ModuleNotFoundError: No
          # module named 'azure'" the moment it tries to create/update a test
          # case — this build's minimal requirements never carried them.
          # Found via the SAME bug in remote-run.yml's worker (every queued
          # remote run failed identically, confirmed live against the
          # remote_runs table) — pinned to the same versions as the desktop
          # build's requirements.txt for consistency.
          #
          # EXPORT LIBRARIES (openpyxl/python-docx/reportlab + their deps):
          # the Regression/Sprint/Task-Manager/AI-Usage export buttons import
          # these lazily (openpyxl for .xlsx, python-docx for .docx, reportlab
          # for .pdf). They were deliberately left OUT of the minimal mobile
          # bundle originally — so every Word/Excel/PDF export on mobile threw
          # "ModuleNotFoundError / Missing dependency" and did nothing (reported
          # live: "the exporters not working in the application"). Bundling them
          # now for full desktop parity, pinned to the desktop requirements.txt
          # versions. NOTE: unlike the pure-Python deps above, lxml (python-docx)
          # and reportlab/pillow carry native/C components — if a future
          # `flet build apk` fails resolving a non-pure wheel for android-arm64,
          # this block is the first place to look (drop the offending lib and
          # its exports degrade to a "desktop only" notice rather than failing
          # the whole build). et_xmlfile is openpyxl's runtime dep; lxml is
          # python-docx's; pillow is reportlab's image dep.
          printf "flet==0.85.3\nrequests\nflet-secure-storage==0.85.3\nazure-core==1.41.0\nazure-devops==7.1.0b4\nmsrest==0.7.1\nopenpyxl==3.1.5\net_xmlfile==2.0.0\npython-docx==1.2.0\nlxml==6.1.1\nreportlab==5.0.0\npillow==12.2.0\n" > /tmp/mobile/requirements.txt
          # BIOMETRIC PROMPT PREREQUISITES (see BIOMETRICS_FIX_PLAN.md). The
          # biometric login gate (secure_store_mobile.py, enforce_biometrics=True)
          # could NEVER pop the OS prompt on any prior build because three Android
          # requirements were missing. Two are set here declaratively; the third
          # (host Activity must be FlutterFragmentActivity) is patched after the
          # build below, since Flet doesn't expose MainActivity.
          #   * USE_BIOMETRIC / USE_FINGERPRINT: without the manifest permission
          #     the prompt can't be requested at all (USE_FINGERPRINT is the
          #     pre-API-28 fallback).
          #   * min_sdk_version 28: enforce_biometrics=True requires API 28+;
          #     Flet's default is lower, so the plugin threw / no-op'd.
          # flet build reads these from pyproject.toml's [tool.flet.*] tables.
          cat >> /tmp/mobile/pyproject.toml <<'TOML'

          [tool.flet.android.permission]
          "android.permission.USE_BIOMETRIC" = true
          "android.permission.USE_FINGERPRINT" = true

          [tool.flet.android]
          min_sdk_version = 28
          TOML
          # Ship the flet_local_auth extension's Python module in the app bundle
          # (its Flutter side is bundled via the CI-env install above). Absolute
          # local path so serious-python installs the wheel into the on-device
          # bundle; the extension's flutter/ dir rides along harmlessly.
          WHL=$(ls /tmp/ext-wheels/flet_local_auth-*.whl | head -n1)
          cp "$WHL" /tmp/mobile/
          echo "/tmp/mobile/$(basename "$WHL")" >> /tmp/mobile/requirements.txt
          # App icon: `flet build` only customizes the launcher icon if it
          # finds <staged-app>/assets/icon.png (see flet_cli's customize_icons()
          # — assets_path.exists() gates the whole step). This directory was
          # never staged, so every APK build has shipped Flutter's own default
          # template icon instead of the QA Studio logo — the reported
          # "missing" app icon. Fixed by staging the same canonical brand
          # asset every other surface already uses (qa-logo.png, falling back
          # to app.png — see DEV_ROADMAP.md's app-icon entry for why those two
          # are kept identical) as assets/icon.png, which flutter_launcher_icons
          # then uses for both the regular launcher icon and, as a fallback,
          # the Android adaptive-icon foreground.
          mkdir -p /tmp/mobile/assets
          cp qa-logo.png /tmp/mobile/assets/icon.png 2>/dev/null \
            || cp app.png /tmp/mobile/assets/icon.png

      # INCIDENT this step guards against: with no signing config, each CI run
      # got a fresh, random debug-style key from the ephemeral runner (a new
      # keystore every dispatch — nothing persists between runs). Android
      # refuses to install an APK over an existing install signed with a
      # DIFFERENT certificate ("App not installed as package conflicts with an
      # existing package") — so every single build after the first broke
      # in-place updates on-device, forcing an uninstall every time. Fixed by
      # signing every build with the SAME persistent keystore (repo secret),
      # so successive releases share one certificate and install over each
      # other normally, like any real Android app.
      - name: Decode Android signing keystore
        working-directory: /tmp/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 repo secret is not set. Building without it"
            echo "::error::reproduces the 'conflicts with an existing package' bug on every"
            echo "::error::future update (each build gets a different throwaway key). Add the"
            echo "::error::four ANDROID_* secrets (see qa-studio-signing/SETUP.md) before"
            echo "::error::re-running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > qa-studio-release.jks

      - name: Build APK
        working-directory: /tmp/mobile
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: /tmp/mobile/qa-studio-release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # `yes |` auto-answers any residual interactive confirm (e.g. flet
          # offering to install its own Flutter) — CI has no stdin.
          # --android-adaptive-icon-background: qa-logo.png is a soft glow
          # fading to transparent, not a filled square — without an explicit
          # background Android's adaptive-icon mask can composite it onto a
          # black system default depending on launcher/OEM. White matches the
          # glow's own fade and every other white-card surface the logo
          # already sits on in-app.
          yes | flet build apk --project "QA Studio" --org com.qastudio \
            --android-adaptive-icon-background "#FFFFFF" --verbose

      # BIOMETRIC PROMPT PREREQUISITE #3 (see BIOMETRICS_FIX_PLAN.md): the host
      # Activity must extend FlutterFragmentActivity, because Android's
      # BiometricPrompt (used by flutter_secure_storage's enforce_biometrics
      # path) attaches to a FragmentManager that a plain FlutterActivity doesn't
      # have. Flet generates a MainActivity extending FlutterActivity and exposes
      # no option to change it, so patch the generated Kotlin source and rebuild
      # the APK from the Flutter project Flet already generated. The signing
      # config Flet wrote from the FLET_ANDROID_SIGNING_* envs (android/
      # key.properties + the jks) persists in that generated project, so the
      # rebuilt APK stays signed with the SAME keystore — critical, or in-place
      # updates break (see the signing step above).
      #
      # VERSION-FRAGILE: the generated paths (build/flutter, MainActivity.kt
      # location) are Flet-0.85.3 / Flutter-3.41.7 specifics. Re-verify this step
      # whenever either pin changes — it fails loud if the source or output moves.
      - name: Patch host Activity to FlutterFragmentActivity + rebuild
        working-directory: /tmp/mobile
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: /tmp/mobile/qa-studio-release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          MA=$(find build -name 'MainActivity.kt' | head -n1 || true)
          if [ -z "$MA" ]; then
            echo "::error::MainActivity.kt not found under build/ — Flet's generated"
            echo "::error::layout changed; re-verify this patch step against the new"
            echo "::error::Flet version before trusting the biometric prompt."
            exit 1
          fi
          echo "Patching $MA"
          sed -i -E 's/import io\.flutter\.embedding\.android\.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$MA"
          sed -i -E 's/(:[[:space:]]*)FlutterActivity([^A-Za-z]|$)/\1FlutterFragmentActivity\2/' "$MA"
          if ! grep -q 'FlutterFragmentActivity' "$MA"; then
            echo "::error::FragmentActivity patch did not apply — MainActivity.kt"
            echo "::error::no longer matches the expected FlutterActivity pattern."
            exit 1
          fi
          # Rebuild the (patched) APK in-place from Flet's generated Flutter project.
          FLUTTER_DIR=$(dirname "$(find build -name 'pubspec.yaml' -path '*flutter*' | head -n1)")
          echo "Rebuilding signed APK in $FLUTTER_DIR"
          ( cd "$FLUTTER_DIR" && flutter build apk --release )
          PATCHED_APK=$(find "$FLUTTER_DIR" -path '*outputs*' -name '*release*.apk' | head -n1)
          if [ -z "$PATCHED_APK" ]; then
            echo "::error::patched release APK not produced — check the flutter build output above."
            exit 1
          fi
          mkdir -p build/apk
          cp "$PATCHED_APK" build/apk/
          echo "Patched, re-signed APK staged at build/apk/: $(basename "$PATCHED_APK")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-studio-apk
          path: /tmp/mobile/build/apk/*.apk
          if-no-files-found: error

      # ROOT CAUSE this step fixes: index.html's "Android APK" link and the
      # in-app update-available popup's Download button both resolve the
      # APK via GitHub Releases (releases/latest or releases/download/TAG),
      # but every mobile build this project has ever produced only ever
      # landed as a GitHub Actions *artifact* (the step above) — artifacts
      # require repo-scoped `gh`/API auth to fetch and expire after 90 days,
      # so they were never reachable by an anonymous download link or the
      # in-app updater. Meanwhile the desktop's versioned GitHub Releases
      # (vX.Y.Z, published by release.bat) haven't been cut since v2.1.1 —
      # VERSION has since climbed to 3.x+ with no matching release, so
      # `releases/latest` resolves to a release that predates mobile
      # entirely and has no working .apk asset at all. Fixed by publishing
      # every successful CI build straight to a dedicated, permanent,
      # NON-latest release (tag `android-apk`, marked prerelease so it never
      # becomes GitHub's "latest" release and never collides with the
      # desktop's own vX.Y.Z semantic releases) — `--clobber` replaces the
      # single `qa-studio.apk` asset in place each run, so this tag's
      # download URL is always a stable, world-downloadable pointer at the
      # newest successful build with zero manual release.bat step required.
      - name: Publish to rolling Android release
        working-directory: /tmp/mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls build/apk/*.apk | head -n1)
          cp "$APK" qa-studio.apk
          if ! gh release view android-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "QA Studio — Android (rolling build)" \
              --notes "Always the most recent successful Android CI build. Not a versioned release — see the desktop vX.Y.Z releases for those. Re-published automatically on every build-apk.yml run." \
              --prerelease
          fi
          gh release upload android-apk qa-studio.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
